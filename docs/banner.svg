<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-label="岗位全景：28 个行业、848 个岗位、20 条协作链路">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF9F6"/>
      <stop offset="1" stop-color="#F1EFE9"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#E6E2D9"/>
    </pattern>
  </defs>

  <rect width="1440" height="360" fill="url(#wash)"/>
  <rect width="1440" height="360" fill="url(#dots)" opacity="0.65"/>

  <!-- 左侧：标识与定位 -->
  <g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Segoe UI, system-ui, sans-serif">
    <rect x="80" y="78" width="44" height="44" rx="12" fill="#4C5FD5" opacity="0.12"/>
    <path d="M96 92h12a4 4 0 0 1 4 4v20a4 4 0 0 1-4 4H96a4 4 0 0 1-4-4V96a4 4 0 0 1 4-4z" fill="none" stroke="#4C5FD5" stroke-width="2"/>
    <path d="M98 100h8M98 106h8M98 112h5" stroke="#4C5FD5" stroke-width="2" stroke-linecap="round"/>

    <text x="140" y="112" font-size="44" font-weight="600" fill="#1F1D1A">岗位全景</text>
    <text x="344" y="112" font-size="15" font-weight="500" fill="#B5713F" letter-spacing="1">jobWiki</text>

    <text x="80" y="160" font-size="18" fill="#6B6459">行业 → 分组 → 岗位；协作链路 → 阶段 → 交付关系</text>
    <text x="80" y="192" font-size="15" fill="#6B6459">一份自持数据集，把 848 个岗位的归属与协作顺序放进同一个视图</text>

    <!-- 数字 -->
    <g font-size="14" fill="#6B6459">
      <rect x="80" y="228" width="132" height="46" rx="12" fill="#FFFFFF" stroke="#E6E2D9"/>
      <text x="98" y="248" font-size="20" font-weight="600" fill="#1F1D1A">28</text>
      <text x="132" y="248">个行业</text>
      <text x="98" y="264" font-size="11">161 个分组</text>

      <rect x="224" y="228" width="146" height="46" rx="12" fill="#FFFFFF" stroke="#E6E2D9"/>
      <text x="242" y="248" font-size="20" font-weight="600" fill="#1F1D1A">848</text>
      <text x="284" y="248">个岗位</text>
      <text x="242" y="264" font-size="11">去重后的岗位条目</text>

      <rect x="382" y="228" width="168" height="46" rx="12" fill="#FFFFFF" stroke="#E6E2D9"/>
      <text x="400" y="248" font-size="20" font-weight="600" fill="#1F1D1A">20</text>
      <text x="428" y="248">条协作链路</text>
      <text x="400" y="264" font-size="11">覆盖 273 个岗位</text>
    </g>
  </g>

  <!-- 右侧：链路画布的缩略示意 -->
  <g font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, Segoe UI, system-ui, sans-serif">
    <rect x="640" y="60" width="740" height="240" rx="18" fill="#FFFFFF" opacity="0.75" stroke="#E6E2D9"/>

    <!-- 第一行：三个阶段 -->
    <g>
      <rect x="690" y="112" width="168" height="62" rx="12" fill="#FFFFFF" stroke="#E6E2D9"/>
      <text x="706" y="136" font-size="12" fill="#6B6459">阶段 01</text>
      <text x="706" y="158" font-size="14" font-weight="500" fill="#1F1D1A">需求与产品定义</text>

      <rect x="946" y="112" width="168" height="62" rx="12" fill="#FFFFFF" stroke="#E6E2D9"/>
      <text x="962" y="136" font-size="12" fill="#6B6459">阶段 02</text>
      <text x="962" y="158" font-size="14" font-weight="500" fill="#1F1D1A">交互与视觉设计</text>

      <rect x="1202" y="112" width="140" height="62" rx="12" fill="#FFFFFF" stroke="#E6E2D9"/>
      <text x="1218" y="136" font-size="12" fill="#6B6459">阶段 03</text>
      <text x="1218" y="158" font-size="14" font-weight="500" fill="#1F1D1A">研发实现</text>
    </g>

    <!-- 交付连线：一条关系一颗点 -->
    <g fill="#4C5FD5" opacity="0.55">
      <circle cx="878" cy="143" r="3"/><circle cx="898" cy="143" r="3"/><circle cx="918" cy="143" r="3"/>
      <circle cx="1134" cy="143" r="3"/><circle cx="1154" cy="143" r="3"/><circle cx="1174" cy="143" r="3"/>
    </g>
    <rect x="878" y="141" width="40" height="4" rx="2" fill="#E6E2D9"/>
    <rect x="1134" y="141" width="40" height="4" rx="2" fill="#E6E2D9"/>
    <text x="898" y="126" font-size="11" fill="#6B6459" text-anchor="middle">6 条</text>
    <text x="1154" y="126" font-size="11" fill="#6B6459" text-anchor="middle">8 条</text>

    <!-- 折返 -->
    <g opacity="0.6">
      <rect x="1266" y="174" width="4" height="30" rx="2" fill="#E6E2D9"/>
      <circle cx="1268" cy="182" r="3" fill="#4C5FD5"/>
      <circle cx="1268" cy="196" r="3" fill="#4C5FD5"/>
      <path d="M1250 216h34" stroke="#E6E2D9" stroke-dasharray="6 6" stroke-width="1.5"/>
      <text x="1296" y="220" font-size="11" fill="#6B6459">折返</text>
    </g>

    <!-- 第二行 -->
    <g>
      <rect x="1202" y="238" width="140" height="46" rx="12" fill="#FFFFFF" stroke="#E6E2D9"/>
      <text x="1218" y="261" font-size="12" fill="#6B6459">阶段 04</text>
      <text x="1218" y="277" font-size="13" font-weight="500" fill="#1F1D1A">测试验证</text>
      <rect x="946" y="238" width="140" height="46" rx="12" fill="#FFFFFF" stroke="#E6E2D9"/>
      <text x="962" y="261" font-size="12" fill="#6B6459">阶段 05</text>
      <text x="962" y="277" font-size="13" font-weight="500" fill="#1F1D1A">上线与运维</text>
    </g>

    <!-- 岗位层：一粒点代表一个岗位 -->
    <g fill="#4C5FD5" opacity="0.75">
      <circle cx="720" cy="206" r="4"/><circle cx="762" cy="206" r="4"/><circle cx="804" cy="206" r="4"/>
      <circle cx="976" cy="206" r="4"/><circle cx="1018" cy="206" r="4"/>
      <circle cx="1150" cy="206" r="4"/><circle cx="1192" cy="206" r="4"/><circle cx="1234" cy="206" r="4"/>
    </g>
  </g>
</svg>
